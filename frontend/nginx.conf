server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 蓋掉 client 端自己帶的值，backend 才能安全信任這個 header 來判斷 secure cookie
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LINE webhook：對外部署時 backend:8000 不會發布到 host，
    # 平台要打進來一樣得經過這裡轉給 backend，不然 /webhook/line 收不到請求
    location /webhook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

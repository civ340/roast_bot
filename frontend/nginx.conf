# 前面還有一層終結 TLS 的反向代理（Caddy、Cloudflare、ngrok…）時，沿用它帶來的 X-Forwarded-Proto；
# 沒有的話才用 nginx 自己看到的 scheme。backend 靠這個決定 session cookie 要不要加 Secure。
map $http_x_forwarded_proto $tongue_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 後台 API 的請求頻率上限（每個來源 IP）
limit_req_zone $binary_remote_addr zone=tongue_api:10m rate=20r/s;

server {
    listen 80;
    server_tokens off;

    # 連線來自內網（同一台機器或 docker 網路上的反向代理）時，才相信它帶的 X-Forwarded-For，
    # 這樣登入鎖定跟上面的頻率限制看到的才是真正的來源 IP，而不是反向代理的 IP
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 給 Telegram/Discord bot 用的內部端點：bot 是從 docker 內部網路直接打 backend:8000，
    # 不會經過這裡，所以從外面進來的一律擋掉，不要讓共享密鑰變成唯一的防線
    location ~ ^/api/(roast|excuse)(/|$) {
        return 404;
    }

    location /api {
        limit_req zone=tongue_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $tongue_forwarded_proto;
    }

    # LINE webhook：對外部署時 backend:8000 不會發布到 host，
    # 平台要打進來一樣得經過這裡轉給 backend，不然 /webhook/line 收不到請求
    location /webhook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $tongue_forwarded_proto;
    }
}
